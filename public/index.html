<!DOCTYPE html>
<html>
    <head>
        <title>MMOrms</title>
        <script src="https://code.createjs.com/easeljs-0.8.2.min.js"></script>
        <script type="text/javascript">
            window.onload = function () {
                var conn;
                var myClientId;
                var tanks = {};
                var bullets = {};
                var mapBitmap;
                var canvas = document.getElementById('maskCanvas');
                var ctx = canvas.getContext('2d');
                var WIDTH = 1260;
                var HEIGHT = 620;
                var maskImageData = ctx.createImageData(WIDTH, HEIGHT);
                var inputState = {
                  moving: 0,
                  power: 0,
                  direction: 1
                };
                var stage = new createjs.Stage("gameCanvas");

                window.me = function() {
                    return tanks[myClientId];
                }

                function Tank (x, y, hp, clientId) {
                    this.x = x;
                    this.y = y;
                    this.clientId = clientId;

                    this.maxHp = hp;
                    this.hp = this.maxHp;
                    this.hpLabel = new createjs.Text(this.hp + "/" + this.maxHp,
                        "11px Roboto",
                        "Red");

                    this.shape = new createjs.Container();
                    this.shape.regX = 0;
                    this.shape.regY = 25;
                    this.shape.x = this.x;
                    this.shape.y = this.y;
                    this.gun = new createjs.Bitmap("/tank6-gun-fix1.png");
                    this.body = new createjs.Bitmap("/tank6-body.png");
                    this.shape.addChild(this.gun);
                    this.shape.addChild(this.body);
                    this.shape.addChild(this.hpLabel);
                    this.gun.regX = 46;
                    this.gun.regY = 25;
                    this.body.regX = 47;
                    this.body.regY = 25;
                    this.hpLabel.regX = 20;
                    this.hpLabel.regY = -35;
                    stage.addChild(this.shape);
                }

                Tank.prototype.updateState = function(x, y, hp) {
                    this.x = x;
                    this.y = y;
                    this.hp = hp;
                    this.shape.x = this.x;
                    this.shape.y = this.y;
                    this.hpLabel.text = this.hp + "/" + this.maxHp;
                }

                Tank.prototype.destroy = function() {
                    stage.removeChild(this.shape);
                    stage.removeChild(this.hpLabel);
                }


                function Bullet (x, y, id) {
                    this.x = x;
                    this.y = y;
                    this.id = id;
                    this.shape = new createjs.Shape();
                    this.shape.graphics.beginFill("Red").drawCircle(0, 0, 5);
                    this.shape.x = this.x;
                    this.shape.y = this.y;
                    stage.addChild(this.shape);
                }

                Bullet.prototype.updateState = function(x, y) {
                    this.x = x;
                    this.y = y;
                    this.shape.x = this.x;
                    this.shape.y = this.y;
                }

                if (window["WebSocket"]) {
                    conn = new WebSocket("ws://" + window.location.host + "/ws");
                    conn.binaryType = "arraybuffer";
                    conn.onclose = function (evt) {
                        console.log("Connection closed")
                    };
                    conn.onerror = function (evt) {
                        console.log("Connection failed, trying again");
                        console.log(evt);
                        conn = new WebSocket("ws://" + window.location.host + "/ws");
                        conn.binaryType = "arraybuffer";
                    };
                    conn.onmessage = function (evt) {
                        var messageByteView = new Int8Array(evt.data);
                        switch (messageByteView[0]) {
                        case 0: // map update
                            mapBitmap = new Int8Array(evt.data, 1); 
                            updateMapCanvas();
                            break;
                        case 1: // state update
                            var clientsNum = messageByteView[1];
                            var messageView = new Uint32Array(evt.data.slice(2));
                            for (i = 0; i < clientsNum; i++) {
                                var clientId = messageView[i*4];
                                var tankClientX = messageView[i*4 + 1];
                                var tankClientY = messageView[i*4 + 2];
                                var tankClientHp = messageView[i*4 + 3];
                                if (!tanks[clientId]) {
                                    tanks[clientId] =
                                        new Tank(tankClientX,
                                            tankClientY,
                                            tankClientHp,
                                            clientId);
                                } else {
                                    tanks[clientId].updateState(tankClientX,
                                        tankClientY,
                                        tankClientHp);
                                }
                            }
                            break;
                        case 2: // greetings message
                            myClientId = (new Uint32Array(evt.data.slice(1)))[0];
                            console.log("I am " + myClientId);
                            break;
                        case 3: // bullets update
                            var bulletsNum = messageByteView[1];
                            var messageView = new Uint32Array(evt.data.slice(2));
                            for (i = 0; i < bulletsNum; i++) {
                                var id = messageView[i*3];
                                var bulletX = messageView[i*3 + 1];
                                var bulletY = messageView[i*3 + 2];
                                if (!bullets[id]) {
                                    bullets[id] =
                                        new Bullet(bulletX, bulletY, id);
                                } else {
                                    bullets[id].updateState(bulletX, bulletY);
                                }
                            }
                            break;
                        case 4: // death message
                            var messageData = new Uint32Array(evt.data.slice(1));
                            var deadId = messageData[0],
                                x = messageData[1],
                                y = messageData[2],
                                radius = messageData[3];
                            // console.log(deadId + " died at " + x + ", " + y + " with r=" + radius);
                            if (radius > 0) {
                                explodeAt(x, y, radius);
                            }
                            if (tanks.hasOwnProperty(deadId)) {
                                tanks[deadId].destroy();
                                if (deadId == myClientId) {
                                    inputState.direction = 1;
                                }
                                delete tanks[deadId];
                            }
                            if (bullets.hasOwnProperty(deadId)) {
                                stage.removeChild(bullets[deadId].shape);
                                delete bullets[deadId];
                            }
                        }
                    };
                } else {
                    var item = document.createElement("div");
                    body.innerHTML = "<b>Your browser does not support WebSockets.</b>";
                    return;
                }

                function changeAngle(arrowUp) {
                    var cosAngle = Math.cos(me().gun.rotation * Math.PI / 180);
                    var sinAngle = Math.sin(me().gun.rotation * Math.PI / 180);
                    if (!arrowUp && sinAngle > 0 && Math.abs(cosAngle) < 0.92) {
                        return; // gun is already too low
                    }
                    if (arrowUp && sinAngle < 0 && Math.abs(cosAngle) < 0.09) {
                        return; // gun is already too high
                    }
                    var inc = 2 * cosAngle / Math.abs(cosAngle);
                    me().gun.rotation += arrowUp ? -1 * inc : inc;
                }

                function getShootingPower(inputState) {
                    var power = Math.floor((Date.now() - inputState.power) / 300);
                    if (power <= 0) {
                        power = 1;
                    }
                    if (power > 10) {
                        power = 10;
                    }
                    return power;
                }


                window.addEventListener("keydown", function(e) {
                    if (e.code == "ArrowLeft" || e.code == "ArrowRight") {
                        var newDir = (e.code == "ArrowLeft") ? -1 : 1;
                        if (inputState.direction != newDir) {
                            me().gun.rotation = 180 - me().gun.rotation;
                        }
                        inputState.direction = newDir;
                        inputState.moving = newDir;
                    }
                    if (e.code == "ArrowUp" || e.code == "ArrowDown") {
                        changeAngle(e.code == "ArrowUp");
                    }
                    if (e.code == "Space") {
                        if (inputState.power == 0) {
                            inputState.power = Date.now();
                            function updateGun() {
                                if (inputState.power == 0) {
                                    return;
                                }
                                var power = getShootingPower(inputState);
                                me().gun.filters = [new createjs.ColorFilter(1, 0, 0, power/10)];
                                me().gun.cache(0, 0, 100, 100);
                                setTimeout(updateGun, 100);
                            }
                            setTimeout(updateGun, 100);
                        }
                    }
                });
                window.addEventListener("keyup", function(e) {
                    if (e.code == "ArrowLeft" || e.code == "ArrowRight") {
                      inputState.moving = 0;
                    }
                    if (e.code == "Space") {
                        inputState.power = getShootingPower(inputState);
                        console.log("Shooting with power " + inputState.power);
                        var a = me().gun.rotation * Math.PI / 180;
                        var aimX = Math.cos(a) * 1000,
                            aimY = Math.sin(a) * 1000;
                        var messageBuffer = new ArrayBuffer(10);
                        var dataView = new DataView(messageBuffer);
                        dataView.setUint8(0, 1);
                        dataView.setInt32(1, aimX, true /* little endian */);
                        dataView.setInt32(5, aimY, true /* little endian */);
                        dataView.setUint8(9, inputState.power);
                        console.log(aimX, aimY);
                        conn.send(messageBuffer);
                        inputState.power = 0;
                        me().gun.filters = [];
                        me().gun.cache(0, 0, 100, 100);
                    }
                });

                setInterval(function() { // Sending packets to server
                      var messageBuffer = new ArrayBuffer(2);
                      var messageView = new Uint8Array(messageBuffer);
                      messageView[0] = 0; // 0 - moving type of message
                      messageView[1] = inputState.moving;
                      if (conn.readyState === conn.OPEN) {
                          conn.send(messageBuffer);
                      } else {
                          //console.log("Still waiting for the conn to be established");
                      }
                }, 200);

                // Draw the map bitmap to a canvas to use
                // it as an alpha mask for map theme image

                // Update pixel data and blit back to canvas (~5ms cold)
                function updateMapCanvas() {
                    var data = maskImageData.data;
                    var bmpStart2 = performance.now();
                    updateMaskPixelsFromMap(mapBitmap, data);
                    ctx.putImageData(maskImageData, 0, 0);
                    var bmpDelta2 = performance.now() - bmpStart2;
                    console.log("BMP batch drawing took " + bmpDelta2 + " milliseconds");
                }
                
                function updateMaskPixelsFromMap(map, pixels) {
                    for (var p = 0, l = map.length; p < l; p += 4) {
                        var q = p*4;
                        pixels[q+3] = map[p] * 255;
                        pixels[q+7] = map[p+1] * 255;
                        pixels[q+11] = map[p+2] * 255;
                        pixels[q+15] = map[p+3] * 255;
                    }
                }
                
                var bgSky = new createjs.Shape();
                bgSky.graphics.beginFill("white").drawRect(0, 0, WIDTH, HEIGHT);
                stage.addChild(bgSky);

                // Background "theme" image.
                var bgImage = new createjs.Bitmap("/theme.jpg");
                bgImage.filters = [
                    new createjs.AlphaMaskFilter(canvas)
                ];
                stage.addChild(bgImage);

                function explodeAt(cx, cy, r) {
                    var data = maskImageData.data;
                    var bmpStart2 = performance.now();
                    // Example map update comes
                    var rs = Math.pow(r, 2);
                    var sx = Math.max(cx - r, 0), sy = Math.max(cy - r, 0);
                    var ly = Math.min(cy + r, HEIGHT), lx = Math.min(cx + r, WIDTH);
                    for (var y = sy; y < ly; y++) {
                        for (var x = sx; x < lx; x++) {
                            var ds = Math.pow(y-cy, 2) + Math.pow(x-cx, 2);
                            if (ds < rs) {
                                mapBitmap[x + y*WIDTH] = 0;
                            }
                        }
                    }
                    updateMaskPixelsFromMap(mapBitmap, data);
                    ctx.putImageData(maskImageData, 0, 0, sx, sy, 2*r, 2*r);
                    var bmpDelta2 = performance.now() - bmpStart2;
                    // console.log("Explosion update took " + bmpDelta2 + " milliseconds");
                }

                // Render loop.
                createjs.Ticker.on("tick", tick);
                createjs.Ticker.setFPS(60);
                function tick(evt) {
                    bgImage.cache(0, 0, WIDTH, HEIGHT); // every frame?
                    stage.update();
                }
            };
        </script>
        <style type="text/css">
        </style>
    </head>
<body style="overflow:hidden;">
    <canvas id="gameCanvas" width="1260" height="620" style="overflow: hidden;"></canvas>
    <canvas id="maskCanvas" width="1260" height="620" style="display: none; overflow: hidden;"></canvas>
</body>
</html>
