<!DOCTYPE html>
<html>
    <head>
        <title>Tankoids - artillery based shooter game</title>
        <script src="https://code.createjs.com/easeljs-0.8.2.min.js"></script>
        <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet"/>
        <script src="/render.js"></script>
        <script src="/game.js"></script>
        <meta name="description" content="Free multiplayer artillery based shooting game with tanks inspired by Worms, available in your browser."/>
    </head>
<body style="margin: 0; padding: 0; overflow: hidden;">
    <div style="position: absolute; width: 100%; height: 100%; display: table">
        <div style="display: table-cell; vertical-align: middle">
            <div style="width: 1266px; margin: 0 auto; position: relative;">
                <div id="login" style="
                        background: #dedede;
                        height: 215px;
                        width: 600px;
                        position: absolute;
                        top: 20%;
                        left: 50%;
                        margin-left: -300px;
                        z-index: 100;
                        font-family: 'Roboto', sans-serif;
                        border-radius: 5px;
                        text-align: center;
                    ">

                    <h1>Tanks</h1>
                    <div style="font-size: 24px;">
                        name: <input id="loginInput" style="font-size: 24px;"/>
                        <button id="playButton" onclick="onPlayButtonClicked()" style="font-size: 24px; box-shadow: 1px 1px 1px gray;">play</button>
                    </div>
                    <div style="margin-top: 20px;">
                        controls: <button style="font-size: 24px; width: 45px;">&larr;</button> <button style="font-size: 24px; width: 45px;">&rarr;</button>
                        <button style="font-size: 24px; width: 45px;">&uarr;</button> <button style="font-size: 24px; width: 45px;">&darr;</button>
                        <button style="font-size: 24px; width: 45px;">z</button>
                        <button style="font-size: 24px; width: 45px;">x</button>
                        <button style="font-size: 24px; width: 45px;">c</button>

                    </div>
                    <!-- TODO: generate randomly hints: what does each button do, when you have shield etc.  -->
                    <p><strong>Did you know?</strong> 
                        <span id="randomHint"></span>
                    </p>
                    <div id="linkbar" style="display: none">
                        <div style="float: right">
                            <!--a class="twitter-share-button" data-size="large" href="https://twitter.com/intent/tweet?text=Come%20and%20play%20%23tankoids%20with%20me!"></a-->
                            <a class="twitter-follow-button" data-show-count="false" data-size="large" href="https://twitter.com/Tankoids"></a>
                        </div>
                        <div style="float: left">
                            <a style="display: inline-block; background: transparent; border-radius: 4px; font-size: 13px; line-height: 26px; padding: 1px 10px; color: #dddddd;" href="https://forums.tigsource.com/index.php?topic=58815.0">Check out our TIGSource devlog</a>
                        </div>
                        <div style="float: right; color: #dedede; ">
                            <span style="display: inline-block; background: transparent; border-radius: 4px; font-size: 13px; line-height: 26px; padding: 1px 10px; color: #dddddd;">Get in touch with devs:</a>
                        </div>
                    </div>
                    <script>
                        setTimeout(function () { document.getElementById("linkbar").style.display = "block"; }, 500)
                    </script>
                </div>
                <div id="overlay" style="background: black; opacity: 0.85; position: absolute; width: 100%; height: 100%;">
                </div>
                <canvas id="gameCanvas" width="1260" height="620"
                    style="overflow: hidden; margin: 0; border: 3px solid gray;">
                    Canvas is not supported?!!
                </canvas>
                <script>window.twttr = (function(d, s, id) {
                  var js, fjs = d.getElementsByTagName(s)[0],
                    t = window.twttr || {};
                  if (d.getElementById(id)) return t;
                  js = d.createElement(s);
                  js.id = id;
                  js.src = "https://platform.twitter.com/widgets.js";
                  fjs.parentNode.insertBefore(js, fjs);

                  t._e = [];
                  t.ready = function(f) {
                    t._e.push(f);
                  };

                  return t;
                }(document, "script", "twitter-wjs"));</script>
            </div>
        </div>
    </div>
    <canvas id="maskCanvas" width="1260" height="620" style="display: none; overflow: hidden;"></canvas>
    <canvas id="maskCanvasBack" width="1260" height="620" style="display: none; overflow: hidden;"></canvas>
<script>
(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)
    },i[r].l=1*new Date();
    a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];
    a.async=1;
    a.src=g;
    m.parentNode.insertBefore(a,m)
})(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
ga('create', 'UA-87997041-1', 'auto');
ga('send', 'pageview');

</body>
</html>
