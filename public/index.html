<!DOCTYPE html>
<html>
    <head>
        <title>MMOrms</title>
        <script src="https://code.createjs.com/easeljs-0.8.2.min.js"></script>
        <script type="text/javascript">
            var conn;
            var tank = {x: 200, y: 200};
            window.onload = function () {
                if (window["WebSocket"]) {
                    conn = new WebSocket("ws://" + window.location.host + "/ws");
                    conn.binaryType = "arraybuffer";
                    conn.onclose = function (evt) {
                        console.log("close")
                    };
                    conn.onmessage = function (evt) {
                        var messageView = new Int32Array(evt.data);
                        tank.x = messageView[0];
                        tank.y = messageView[1];
                        console.log("message", messageView[0]);
                    };
                } else {
                    var item = document.createElement("div");
                    body.innerHTML = "<b>Your browser does not support WebSockets.</b>";
                    return;
                }

                var inputState = {
                  moving: 0
                };

                window.addEventListener("keydown", function(e) {
                    if (e.code == "ArrowLeft" || e.code == "ArrowRight") {
                      inputState.moving = (e.code == "ArrowLeft") ? -1 : 1;
                    }
                });
                window.addEventListener("keyup", function(e) {
                    if (e.code == "ArrowLeft" || e.code == "ArrowRight") {
                      inputState.moving = 0;
                    }
                });

                setInterval(function() { // Sending packets to server
                  var messageBuffer = new ArrayBuffer(1);
                  var messageView = new Uint8Array(messageBuffer);
                  messageView[0] = inputState.moving;
                  conn.send(messageBuffer);
                }, 200);

                var WIDTH = 1260;
                var HEIGHT = 620;
                var stage = new createjs.Stage("gameCanvas");

                // TODO: download data from the server
                var mapBitmapBuffer = new ArrayBuffer(WIDTH * HEIGHT);
                var mapBitmapByteView = new Uint8Array(mapBitmapBuffer);
                for (var x = 0; x < WIDTH; x++) {
                    var groundCurve = 200 + (x/400.0*Math.sin(x/100.0) + 1.2) * 100;
                    for (var y = 0; y < HEIGHT; y++) {
                        mapBitmapByteView[x + y*WIDTH] = y < groundCurve ? 0 : 1;
                    }
                }
                
                // Draw the map bitmap to a canvas to use
                // it as an alpha mask for map theme image

                // Attempt 1. Draw each pixel through easeljs (~250ms cold)
                var bmpStart = performance.now();
                var bgMask = new createjs.Shape();
                bgMask.graphics.beginFill("rgba(255,0,0,1)");
                for (var y = 0; y < HEIGHT; y++) {
                    for (var x = 0; x < 1280; x++) {
                        if (mapBitmapByteView[x + y*WIDTH] != 0) {
                            bgMask.graphics.drawRect(x, y, 1, 1);
                        }
                    }
                }
                bgMask.cache(0, 0, WIDTH, HEIGHT);
                // we can use bgMask.cacheCanvas for mask
                var bmpDelta = performance.now() - bmpStart;
                console.log("BMP drawing took " + bmpDelta + " milliseconds");

                // Attempt 2. Update pixel data and blit back to canvas (~5ms cold)
                var canvas = document.getElementById('maskCanvas');
                var ctx = canvas.getContext('2d');
                var maskImageData = ctx.createImageData(WIDTH, HEIGHT);
                var data = maskImageData.data;
                function updateMaskPixelsFromMap(map, pixels) {
                    for (var p = 0, l = map.length; p < l; p += 4) {
                        var q = p*4;
                        pixels[q+3] = map[p] * 255;
                        pixels[q+7] = map[p+1] * 255;
                        pixels[q+11] = map[p+2] * 255;
                        pixels[q+15] = map[p+3] * 255;
                    }
                }
                var bmpStart2 = performance.now();
                updateMaskPixelsFromMap(mapBitmapByteView, data);
                ctx.putImageData(maskImageData, 0, 0);
                var bmpDelta2 = performance.now() - bmpStart2;
                console.log("BMP batch drawing took " + bmpDelta2 + " milliseconds");

                // Background "theme" image.
                var bgImage = new createjs.Bitmap("/theme.jpg");
                bgImage.filters = [
                    new createjs.AlphaMaskFilter(canvas)
                ];
                stage.addChild(bgImage);

                window.explode = 50;
                stage.on("click", function (evt) {
                    var bmpStart2 = performance.now();
                    // Example map update comes
                    var cx = evt.stageX, cy = evt.stageY, r = window.explode, rs = Math.pow(r, 2);
                    var sx = Math.max(cx - r, 0), sy = Math.max(cy - r, 0);
                    var ly = Math.min(cy + r, HEIGHT), lx = Math.min(cx + r, WIDTH);
                    for (var y = sy; y < ly; y++) {
                        for (var x = sx; x < lx; x++) {
                            var ds = Math.pow(y-cy, 2) + Math.pow(x-cx, 2);
                            if (ds < rs) {
                                mapBitmapByteView[x + y*WIDTH] = 0;
                            }
                        }
                    }
                    updateMaskPixelsFromMap(mapBitmapByteView, data);
                    ctx.putImageData(maskImageData, 0, 0, sx, sy, 2*r, 2*r);
                    var bmpDelta2 = performance.now() - bmpStart2;
                    console.log("Explosion update took " + bmpDelta2 + " milliseconds");
                });

                // Animated object
                var circle = new createjs.Shape();
                circle.graphics.beginFill("DeepSkyBlue").drawCircle(0, 0, 5);
                circle.x = tank.x;
                circle.y = tank.y;
                stage.addChild(circle);

                // Render loop.
                createjs.Ticker.on("tick", tick);
                createjs.Ticker.setFPS(60);
                var t0 = performance.now();
                var delta = 0;
                function tick(evt) {
                    circle.x += (tank.x - circle.x)/10; 
                    bgImage.cache(0, 0, WIDTH, HEIGHT); // every frame?
                    stage.update();
                    var t1 = performance.now();
                    delta = t1 - t0; t0 = t1;
                    //console.log(delta);
                }
            };
        </script>
        <style type="text/css">
        </style>
    </head>
<body style="overflow:hidden;">
    <canvas id="gameCanvas" width="1260" height="620" style="overflow: hidden;"></canvas>
    <canvas id="maskCanvas" width="1260" height="620" style="display: none; overflow: hidden;"></canvas>
</body>
</html>
