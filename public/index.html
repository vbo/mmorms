<!DOCTYPE html>
<html>
    <head>
        <title>Tankoids - artillery based shooter game</title>
        <script src="https://code.createjs.com/easeljs-0.8.2.min.js"></script>
        <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet"/>
        <script src="/vars.js"></script>
        <script>window.addEventListener('DOMContentLoaded', function() { document.getElementById('versionDisplay').textContent = (typeof window.version !== 'undefined' ? window.version : 'dev'); });</script>
        <script src="/text-encoding/encoding-indexes.js"></script>
        <script src="/text-encoding/encoding.js"></script>
        <script src="/render.js"></script>
        <script src="/game.js"></script>
        <meta name="description" content="Free multiplayer real-time artillery shooting game with tanks inspired by Worms, available in your browser."/>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
        <style>
            #login {
                box-sizing: border-box !important;
                max-width: 600px !important;
                width: calc(100% - 20px) !important;
                left: 50% !important;
                margin-left: 0 !important;
                transform: translateX(-50%);
                padding: 10px 16px !important;
                height: auto !important;
            }
            #login input, #login button { max-width: 100%; }
            #rotateHint {
                display: none;
            }
            @media (orientation: portrait) and (max-width: 900px) {
                #rotateHint {
                    display: flex;
                    position: fixed;
                    inset: 0;
                    z-index: 9999;
                    background: black;
                    color: white;
                    align-items: center;
                    justify-content: center;
                    font-family: 'Roboto', sans-serif;
                    font-size: 22px;
                    text-align: center;
                    padding: 20px;
                }
            }
            #touchControls {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 50;
                display: none;
                font-family: 'Roboto', sans-serif;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                touch-action: none;
            }
            #touchControls.visible { display: block; }
            #touchControls .tc-btn {
                pointer-events: auto;
                position: absolute;
                width: 64px;
                height: 64px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.18);
                border: 2px solid rgba(255, 255, 255, 0.45);
                color: white;
                font-size: 24px;
                font-weight: bold;
                display: flex;
                align-items: center;
                justify-content: center;
                touch-action: none;
            }
            #touchControls .tc-btn.active {
                background: rgba(255, 255, 255, 0.4);
            }
        </style>
    </head>
<body style="margin: 0; padding: 0; overflow: hidden; background: black;">
    <div id="rotateHint">Please rotate your device to landscape to play.</div>
    <div id="touchControls" aria-hidden="true"></div>
    <div style="position: absolute; width: 100%; height: 100%;">
        <div style="width: 100%; height: 100%;">
            <div style="width: 100%; height: 100%; position: relative;">
                <div id="login" style="
                        background: #dedede;
                        height: 215px;
                        width: 600px;
                        position: absolute;
                        top: 20%;
                        left: 50%;
                        margin-left: -300px;
                        z-index: 100;
                        font-family: 'Roboto', sans-serif;
                        border-radius: 5px;
                        text-align: center;
                    ">
                    <h1>Tankoids.Online <span id="versionDisplay" style="font-size: 14px; color: #666;">-</span></h1>
                    <p ></p>
                    <div id="finalScoreBlock" style="display: none; margin-bottom:16px; margin-top: -10px;">You scored <span id="lifeScore">12</span>.</div>
                    <div style="font-size: 24px;">
                        name: <input id="loginInput" style="font-size: 24px;"/>
                        <button id="playButton" onclick="onPlayButtonClicked()" style="font-size: 24px; box-shadow: 1px 1px 1px gray;">play</button>
                    </div>
                    <div style="margin-top: 20px;">
                        controls: <button style="font-size: 24px; width: 45px;">&larr;</button> <button style="font-size: 24px; width: 45px;">&rarr;</button>
                        <button style="font-size: 24px; width: 45px;">&uarr;</button> <button style="font-size: 24px; width: 45px;">&darr;</button>
                        <button style="font-size: 24px; width: 45px;">z</button>
                        <button style="font-size: 24px; width: 45px;">x</button>
                        <button style="font-size: 24px; width: 45px;">c</button>

                    </div>
                    <!-- TODO: generate randomly hints: what does each button do, when you have shield etc.  -->
                    <p><strong>Did you know?</strong> 
                        <span id="randomHint"></span>
                    </p>
                    <div id="linkbar" style="display: none">
                        <div style="float: right">
                            <!--a class="twitter-share-button" data-size="large" href="https://twitter.com/intent/tweet?text=Come%20and%20play%20%23tankoids%20with%20me!"></a-->
                            <a class="twitter-follow-button" data-show-count="false" data-size="large" href="https://twitter.com/Tankoids"></a>
                        </div>
                        <div style="float: left">
                            <a style="display: inline-block; background: transparent; border-radius: 4px; font-size: 13px; line-height: 26px; padding: 1px 10px; color: #dddddd;" href="https://forums.tigsource.com/index.php?topic=58815.0">Check out our TIGSource devlog</a>
                        </div>
                        <div style="float: right; color: #dedede; ">
                            <span style="display: inline-block; background: transparent; border-radius: 4px; font-size: 13px; line-height: 26px; padding: 1px 10px; color: #dddddd;">Get in touch with devs:</a>
                        </div>
                    </div>
                    <script>
                        setTimeout(function () { document.getElementById("linkbar").style.display = "block"; }, 500)
                    </script>
                </div>
                <div id="overlay" style="background: black; opacity: 0.85; position: absolute; width: 100%; height: 100%;">
                </div>
                <canvas id="gameCanvas" width="1260" height="620"
                    style="overflow: hidden; margin: 0; border: 0; display: block; width: 100vw; height: 100vh; object-fit: contain;">
                    Canvas is not supported?!!
                </canvas>
                <script>window.twttr = (function(d, s, id) {
                  var js, fjs = d.getElementsByTagName(s)[0],
                    t = window.twttr || {};
                  if (d.getElementById(id)) return t;
                  js = d.createElement(s);
                  js.id = id;
                  js.src = "https://platform.twitter.com/widgets.js";
                  fjs.parentNode.insertBefore(js, fjs);

                  t._e = [];
                  t.ready = function(f) {
                    t._e.push(f);
                  };

                  return t;
                }(document, "script", "twitter-wjs"));</script>
            </div>
        </div>
    </div>
    <canvas id="maskCanvas" width="1260" height="620" style="display: none; overflow: hidden;"></canvas>
    <canvas id="maskCanvasBack" width="1260" height="620" style="display: none; overflow: hidden;"></canvas>
<script>
(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)
    },i[r].l=1*new Date();

    m=s.getElementsByTagName(o)[0];

    m.parentNode.insertBefore(a,m)
})(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
ga('create', 'UA-87997041-1', 'auto');
ga('send', 'pageview');
</script>
</body>
</html>
