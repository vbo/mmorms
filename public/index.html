<!DOCTYPE html>
<html>
    <head>
        <title>MMOrms</title>
        <script src="https://code.createjs.com/easeljs-0.8.2.min.js"></script>
        <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet"/>
        <script src="/render.js"></script>
        <script src="/game.js"></script>
    </head>
<body style="margin: 0; padding: 0; overflow: hidden;">
    <div style="position: absolute; width: 100%; height: 100%; display: table">
        <div style="display: table-cell; vertical-align: middle">
            <div style="width: 1266px; margin: 0 auto; position: relative;">
                <div id="login" style="
                        background: #dedede;
                        height: 200px;
                        width: 600px;
                        position: absolute;
                        top: 20%;
                        left: 50%;
                        margin-left: -300px;
                        z-index: 100;
                        font-family: 'Roboto', sans-serif;
                        border-radius: 5px;
                        text-align: center;
                    ">
                    <h1>Tanks</h1>
                    <div style="font-size: 24px;">
                        username: <input id="loginInput" style="font-size: 24px;"/>
                        <button id="playButton" onclick="onPlayButtonClicked()" style="font-size: 24px; box-shadow: 1px 1px 1px gray;">play</button>
                    </div>
                    <div style="margin-top: 20px;">
                        controls: <button style="font-size: 24px; width: 45px;">&larr;</button> <button style="font-size: 24px; width: 45px;">&rarr;</button>
                        <button style="font-size: 24px; width: 45px;">&uarr;</button> <button style="font-size: 24px; width: 45px;">&darr;</button>
                        <button style="font-size: 24px; width: 120px;">space</button>
                    </div>

                </div>
                <div id="overlay" style="background: black; opacity: 0.85; position: absolute; width: 100%; height: 100%;">
                </div>
                <canvas id="gameCanvas" width="1260" height="620"
                    style="overflow: hidden; margin: 0; border: 3px solid gray;">
                    Canvas is not supported?!!
                </canvas>
            </div>
        </div>
    </div>
    <canvas id="maskCanvas" width="1260" height="620" style="display: none; overflow: hidden;"></canvas>
</body>
</html>
